[project]
name = "arm-federated-ai-workspace"
version = "0.1.0"
description = "Root workspace for Arm Federated AI platform"
requires-python = ">=3.12"
dependencies = [
    "logfire[fastapi,httpx]>=4.39.0",
    "pydantic>=2.13.4",
    "pydantic-monty>=0.0.23",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "streamlit>=1.63.0",
]

[tool.uv.workspace]
exclude = ["examples"]
members = [
    "src/control_plane",
    "src/data_plane",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
    "ty>=0.0.66",
    "hatchling>=1.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, variables)
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "D",   # pydocstyle (enforces docstrings)
    "UP",  # pyupgrade (modernizes python syntax)
    "C90", # mccabe cyclomatic complexity
]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package (__init__.py)
    "D107",  # Missing docstring in __init__
    "E501",  # E501: Line length 
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[tool.pytest.ini_options]
pythonpath = ["src/control_plane", "src/data_plane", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:logfire"

markers = [
    "smoke: Lightweight health and fast execution checks",
    "unit: Fast isolated unit tests",
    "contract: Plane boundary and protocol contract tests",
    "integration: Cross-module contract and routing tests",
    "security: OWASP AI Agent threat vector and sandbox vulnerability audits",
    "e2e: End-to-end full deployment and workflow tests",
    "unauthenticated: Bypasses automatic identity header injection",
]
