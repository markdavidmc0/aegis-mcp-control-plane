[project]
name = "data-plane"
version = "0.1.0"
description = "Arm Federated AI - gVisor Data Plane Worker"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=3.4.4",
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.0.0",
  "pydantic-monty>=0.0.23",
  "logfire[fastapi]>=4.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicitly include flat layout files/folders inside src/data_plane
[tool.hatch.build.targets.wheel]
packages = ["."]

